---
- name: Install PyMySQL on database server
  apt:
    name: python3-pymysql
    state: present
  become: yes

- name: Create database if not exists
  mysql_db:
    login_host: "{{ mysql_fqdn }}"
    login_user: "{{ mysql_admin_username }}"
    login_password: "{{ mysql_admin_password }}"
    login_port: 3306
    name: bookstore
    state: present
  no_log: true

- name: Check if schema tables are already imported
  mysql_query:
    login_host: "{{ mysql_fqdn }}"
    login_user: "{{ mysql_admin_username }}"
    login_password: "{{ mysql_admin_password }}"
    login_port: 3306
    login_db: bookstore
    query: "SHOW TABLES LIKE 'Books';"
  register: table_check
  no_log: true

- name: Import database schema and seed data if tables don't exist
  mysql_db:
    login_host: "{{ mysql_fqdn }}"
    login_user: "{{ mysql_admin_username }}"
    login_password: "{{ mysql_admin_password }}"
    login_port: 3306
    name: bookstore
    state: import
    target: /var/www/epicbook/db/schema.sql
  when: table_check.rowcount == 0 or table_check.rowcount is undefined
  no_log: true