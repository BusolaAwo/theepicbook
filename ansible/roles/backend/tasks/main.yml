---
- name: Install Node.js 18.x repository
  shell: curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
  args:
    executable: /bin/bash

- name: Install Node.js, npm, and MySQL client
  apt:
    name:
      - nodejs
      - default-mysql-client
    state: present

- name: Create application directory
  file:
    path: /var/www/epicbook
    state: directory
    owner: azureuser
    group: azureuser
    mode: '0755'

- name: Copy application code to server
  copy:
    src: ../../../
    dest: /var/www/epicbook/
    owner: azureuser
    group: azureuser

- name: Install Node.js dependencies
  npm:
    path: /var/www/epicbook
    production: yes
  become_user: azureuser

- name: Configure database settings JSON
  template:
    src: config.json.j2
    dest: /var/www/epicbook/config/config.json
    owner: azureuser
    group: azureuser
    mode: '0600'

- name: Install PM2 process manager globally
  npm:
    name: pm2
    global: yes

- name: Check if PM2 app is already running
  command: pm2 describe epicbook
  register: pm2_check
  failed_when: false
  changed_when: false
  become_user: azureuser
  args:
    chdir: /var/www/epicbook

- name: Start EpicBook application via PM2 (if not running)
  command: pm2 start server.js --name "epicbook"
  args:
    chdir: /var/www/epicbook
  become_user: azureuser
  when: pm2_check.rc != 0

- name: Restart EpicBook application via PM2 (if already running)
  command: pm2 restart epicbook
  args:
    chdir: /var/www/epicbook
  become_user: azureuser
  when: pm2_check.rc == 0

- name: Save PM2 process list and configure startup
  command: pm2 startup systemd -u azureuser --hp /home/azureuser
  become: yes